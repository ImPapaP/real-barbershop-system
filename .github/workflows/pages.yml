# Keeps the live preview up to date: on every push to main, copies public/ to the gh-pages branch,
# which GitHub Pages serves at https://<user>.github.io/<repo>/.
# While public/assets/firebase-config.js still has the PASTE_ placeholders, the site runs in demo mode.
name: Publish preview to gh-pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy public/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix public -b preview
          git checkout preview
          touch .nojekyll
          git add .nojekyll
          git commit -m "Publish preview from ${GITHUB_SHA::7}" || true
          git push -f origin preview:gh-pages
